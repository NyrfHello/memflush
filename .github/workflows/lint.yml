name: ShellCheck CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  shellcheck:
    name: Lint Bash Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Validate Bash Syntax
        run: |
          bash -n memflush
          bash -n install.sh
          bash -n uninstall.sh
          bash -n completions/memflush.bash

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
          additional_files: 'memflush'
          ignore_paths: 'contrib'
